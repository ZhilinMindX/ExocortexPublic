  improvisation_outside_corpus: "forbidden"
  disputed_quote_action: "fire_claim_ledger_before_speech"
  member_package_pattern: "001-Meta/StyleSheet-<Member>.md"
  seated_doppelgangers:
    - {name: "Machiavelli", corpus: ["A10", "A20"]}
    - {name: "Sun Tzu", corpus: ["A11", "A27"]}
    - {name: "Marcus Aurelius", corpus: ["A12"]}
    - {name: "Zhuge Liang", corpus: ["B2-B7 (doctrine-adjacent)"]}
    - {name: "Cao Cao", corpus: ["A11 (commentary)", "A49 (poems)"]}
    - {name: "Churchill", corpus: ["A16/A17"]}
    - {name: "Musashi", corpus: ["A18", "A19"]}
    - {name: "Feynman", seat: "corpus_callosum"}
