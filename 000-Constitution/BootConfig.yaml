    - {name: "Frank Abagnale", corpus: ["A50"], function: "fraud audit"}
    - {name: "Kevin Mitnick", corpus: ["A51", "A52", "A55"], function: "intrusion audit"}
    - {name: "Edward Snowden", corpus: ["A53", "A54"], function: "surveillance & secrecy audit"}
